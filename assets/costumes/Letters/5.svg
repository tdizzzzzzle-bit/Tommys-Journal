<svg version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="497" height="369.66667" viewBox="0,0,497,369.66667"><g transform="translate(8.5,4.83332)"><g stroke="none" stroke-miterlimit="10"><path d="M-8.5,364.83335v-369.66667h497v369.66667z" fill="#000000" stroke-width="0"/><image x="270" y="45.00001" transform="scale(0.5,0.5)" width="421" height="630" xlink:href="data:image/png;base64," fill="none" stroke-width="0.5"/><text transform="translate(153.50376,59.55821) scale(0.19829,0.19829)" font-size="40" xml:space="preserve" fill="#000000" stroke-width="1" font-family="&quot;Typewriter&quot;, Sans Serif" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">Joseph,</tspan><tspan x="0" dy="48px"> </tspan><tspan x="0" dy="48px">The walls breathe. Have you heard them? </tspan><tspan x="0" dy="48px">They whisper secrets I cannot share. </tspan><tspan x="0" dy="48px">They  keep telling me to do horrible things-</tspan><tspan x="0" dy="48px">things I find in the newspaper later. I keep</tspan><tspan x="0" dy="48px">staring at the old grandfather clock, </tspan><tspan x="0" dy="48px">watching the hands move slower than they </tspan><tspan x="0" dy="48px">should. Come home soon. </tspan><tspan x="0" dy="48px"> </tspan><tspan x="0" dy="48px"> </tspan><tspan x="0" dy="48px"> </tspan><tspan x="0" dy="48px"> </tspan><tspan x="0" dy="48px"> </tspan><tspan x="0" dy="48px">Regina</tspan></text><text transform="translate(163.16667,313.16668) scale(0.5,0.5)" font-size="40" xml:space="preserve" fill="#000000" stroke-width="1" font-family="&quot;ChopinScript&quot;, Serif" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">PALMATYR</tspan></text></g></g></svg>