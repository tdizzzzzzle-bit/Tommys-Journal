<svg version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="497" height="369.66667" viewBox="0,0,497,369.66667"><g transform="translate(8.5,4.83334)"><g stroke="none" stroke-miterlimit="10"><path d="M-8.5,364.83334v-369.66667h497v369.66667z" fill="#000000" stroke-width="0"/><image x="267" y="56" transform="scale(0.5,0.5)" width="426" height="608" xlink:href="data:image/png;base64," fill="none" stroke-width="0.5"/><text transform="translate(168.8267,82.89474) scale(0.19829,0.19829)" font-size="40" xml:space="preserve" fill="#000000" stroke-width="1" font-family="&quot;Typewriter&quot;, Sans Serif" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">My Dearest Joseph,</tspan><tspan x="0" dy="48px"> </tspan><tspan x="0" dy="48px">I'm sorry I missed your letter. The days </tspan><tspan x="0" dy="48px">have been long, and I find myself </tspan><tspan x="0" dy="48px">distracted by little things around the </tspan><tspan x="0" dy="48px">house. The radio crackles sometimes, </tspan><tspan x="0" dy="48px">and I swear I hear voices beneath the </tspan><tspan x="0" dy="48px">music. I miss you terribly and cannot </tspan><tspan x="0" dy="48px">wait for you to come home. I made your </tspan><tspan x="0" dy="48px">favorite dinner last night, but it </tspan><tspan x="0" dy="48px">wasn't the same without you here. I look</tspan><tspan x="0" dy="48px">forward to when you stop taking those</tspan><tspan x="0" dy="48px">late shifts.</tspan><tspan x="0" dy="48px"> </tspan><tspan x="0" dy="48px">With all my love,</tspan><tspan x="0" dy="48px">Regina</tspan></text></g></g></svg>