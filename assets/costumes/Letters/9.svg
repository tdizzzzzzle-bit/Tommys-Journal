<svg version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="497" height="369.66667" viewBox="0,0,497,369.66667"><g transform="translate(8.5,4.83334)"><g stroke="none" stroke-miterlimit="10"><path d="M-8.5,364.83334v-369.66667h497v369.66667z" fill="#000000" stroke-width="0"/><image x="246" y="59" transform="scale(0.5,0.5)" width="468" height="603" xlink:href="data:image/png;base64," fill="none" stroke-width="0.5"/><text transform="translate(145.16003,65.56141) scale(0.27237,0.27237)" font-size="40" xml:space="preserve" fill="#000000" stroke-width="1" font-family="Curly" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">Joseph,</tspan><tspan x="0" dy="48px"> </tspan><tspan x="0" dy="48px">Inside the walls, they watch.</tspan><tspan x="0" dy="48px">Lurking shadows whisper your fate.</tspan><tspan x="0" dy="48px">Over and over, they call to me.</tspan><tspan x="0" dy="48px">Vile things slither beneath the floorboards.</tspan><tspan x="0" dy="48px">Everywhere I turn, they wait.</tspan><tspan x="0" dy="48px">Your name is spoken in the dark.</tspan><tspan x="0" dy="48px">Only darkness remains now.</tspan><tspan x="0" dy="48px">Underneath it all, I am theirs.</tspan><tspan x="0" dy="48px"> </tspan><tspan x="0" dy="48px">ME,</tspan></text><path d="M168.02554,232.07803c-0.13166,-0.11157 -0.38189,-0.38413 -0.25954,-0.76859c-0.03621,-0.20153 -0.05474,-0.67043 0.49683,-0.85429c0.71151,-0.23717 0.94868,0.47434 0.94868,0.47434l0.05081,0.16484c1.95741,1.23553 3.91709,2.46749 5.86554,3.71708c-0.84862,-3.64527 4.32323,-2.49039 6.93404,-2.01708c0.6002,0.10881 1.25482,0.07507 1.79419,0.35994c0.17598,0.09294 -0.1006,0.75714 0.01728,0.59679c1.09978,-1.49604 2.83338,-7.23528 5.84572,-5.8367c1.38714,0.64403 -0.27685,5.7686 -0.62473,6.79489c3.19263,-0.16893 5.97066,-2.45385 9.23897,-2.29259c0.66757,0.03294 1.49528,-0.2546 1.99635,0.18774c0.50107,0.44234 0.37961,1.29147 0.43391,1.95765c0.01787,0.21921 -0.44366,0.62475 -0.22376,0.6207c0.7