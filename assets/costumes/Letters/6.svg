<svg version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="497" height="369.66667" viewBox="0,0,497,369.66667"><g transform="translate(8.5,4.83334)"><g stroke="none" stroke-miterlimit="10"><path d="M-8.5,364.83334v-369.66667h497v369.66667z" fill="#000000" stroke-width="0"/><image x="265" y="72" transform="scale(0.5,0.5)" width="430" height="576" xlink:href="data:image/png;base64," fill="none" stroke-width="0.5"/><text transform="translate(157.03333,67.18948) scale(0.3225,0.3225)" font-size="40" xml:space="preserve" fill="#000000" stroke-width="1" font-family="&quot;handwriting 20&quot;, Sans Serif" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">My Love,</tspan><tspan x="0" dy="46.150000000000006px"> </tspan><tspan x="0" dy="46.150000000000006px">Something feels off today. I called home, </tspan><tspan x="0" dy="46.150000000000006px">but you did not answer. I know you are </tspan><tspan x="0" dy="46.150000000000006px">busy, but I can't shake this gnawing feeling </tspan><tspan x="0" dy="46.150000000000006px">that something is amiss. The house felt </tspan><tspan x="0" dy="46.150000000000006px">colder than usual last night without your </tspan><tspan x="0" dy="46.150000000000006px">warmth beside me. Please, my love, </tspan><tspan x="0" dy="46.150000000000006px">write me soon.</tspan><tspan x="0" dy="46.150000000000006px"> </tspan><tspan x="0" dy="46.150000000000006px">Joseph</tspan></text></g></g></svg>