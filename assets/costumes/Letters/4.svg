<svg version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="497" height="369.66667" viewBox="0,0,497,369.66667"><g transform="translate(8.5,4.83334)"><g stroke="none" stroke-miterlimit="10"><path d="M-8.5,364.83334v-369.66667h497v369.66667z" fill="#000000" stroke-width="0"/><image x="284" y="56" transform="scale(0.5,0.5)" width="392" height="609" xlink:href="data:image/png;base64," fill="none" stroke-width="0.5"/><text transform="translate(157.8267,58.22807) scale(0.19829,0.19829)" font-size="40" xml:space="preserve" fill="#000000" stroke-width="1" font-family="&quot;Typewriter&quot;, Sans Serif" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">My Love,</tspan><tspan x="0" dy="48px"> </tspan><tspan x="0" dy="48px">I woke up last night and felt something </tspan><tspan x="0" dy="48px">strange, as if the house itself was </tspan><tspan x="0" dy="48px">breathing around me. The old </tspan><tspan x="0" dy="48px">floorboards creak, but now they sound </tspan><tspan x="0" dy="48px">different, like footsteps that aren't </tspan><tspan x="0" dy="48px">mine. It's probably just my imagination, </tspan><tspan x="0" dy="48px">but it's been on my mind all day. Do you </tspan><tspan x="0" dy="48px">ever feel that way? I think I'm just </tspan><tspan x="0" dy="48px">missing you too much. While you are </tspan><tspan x="0" dy="48px">away I get so lonely.</tspan><tspan x="0" dy="48px"> </tspan><tspan x="0" dy="48px">Yours,</tspan><tspan x="0" dy="48px">Regina</tspan></text></g></g></svg>