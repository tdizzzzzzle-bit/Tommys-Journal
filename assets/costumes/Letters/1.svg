<svg version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="497" height="369.66667" viewBox="0,0,497,369.66667"><g transform="translate(8.5,4.83333)"><g stroke="none" stroke-miterlimit="10"><path d="M-8.5,364.83333v-369.66667h497v369.66667z" fill="#000000" stroke-width="0"/><image x="254" y="40" transform="scale(0.5,0.5)" width="452" height="640" xlink:href="data:image/png;base64," fill="none" stroke-width="0.5"/><text transform="translate(153.7,53.18948) scale(0.3225,0.3225)" font-size="40" xml:space="preserve" fill="#000000" stroke-width="1" font-family="&quot;handwriting 20&quot;, Sans Serif" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">My Dearest Regina,</tspan><tspan x="0" dy="46.150000000000006px"> </tspan><tspan x="0" dy="46.150000000000006px">Every hour away from you feels like a lifetime. </tspan><tspan x="0" dy="46.150000000000006px">The office hums with dull monotony, and yet </tspan><tspan x="0" dy="46.150000000000006px">all I can think of is your laughter, the way it </tspan><tspan x="0" dy="46.150000000000006px">lingers in our home like a melody I never want </tspan><tspan x="0" dy="46.150000000000006px">to forget. I miss you, my love, more than </tspan><tspan x="0" dy="46.150000000000006px">words can say.</tspan><tspan x="0" dy="46.150000000000006px"> </tspan><tspan x="0" dy="46.150000000000006px">Yours forever,</tspan><tspan x="0" dy="46.150000000000006px">Joseph </tspan></text></g></g></svg>