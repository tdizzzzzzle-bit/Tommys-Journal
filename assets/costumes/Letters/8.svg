<svg version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="497" height="369.66667" viewBox="0,0,497,369.66667"><g transform="translate(8.5,4.83332)"><g stroke="none" stroke-miterlimit="10"><path d="M-8.5,364.83335v-369.66667h497v369.66667z" fill="#000000" stroke-width="0"/><image x="244" y="54.00001" transform="scale(0.5,0.5)" width="472" height="613" xlink:href="data:image/png;base64," fill="none" stroke-width="0.5"/><text transform="translate(157.03333,67.52202) scale(0.3225,0.3225)" font-size="40" xml:space="preserve" fill="#000000" stroke-width="1" font-family="&quot;handwriting 20&quot;, Sans Serif" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">Regina,</tspan><tspan x="0" dy="46.150000000000006px"> </tspan><tspan x="0" dy="46.150000000000006px">Your last letter has me very concerned. I</tspan><tspan x="0" dy="46.150000000000006px">am taking the week off, to take care of you</tspan><tspan x="0" dy="46.150000000000006px">guys. I need you to talk to me though. I</tspan><tspan x="0" dy="46.150000000000006px">can't help you when you just stand in our</tspan><tspan x="0" dy="46.150000000000006px">room murmuring about some crooked clown</tspan><tspan x="0" dy="46.150000000000006px">or what not. Please talk to me Regina.</tspan><tspan x="0" dy="46.150000000000006px">I miss you. I love you.</tspan><tspan x="0" dy="46.150000000000006px"> </tspan><tspan x="0" dy="46.150000000000006px">With Love and Concern,</tspan><tspan x="0" dy="46.150000000000006px">Joseph</tspan><tspan x="0" dy="46.150000000000006px"> </tspan></text></g></g></svg>