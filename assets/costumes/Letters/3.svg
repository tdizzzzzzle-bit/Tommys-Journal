<svg version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="497" height="369.66667" viewBox="0,0,497,369.66667"><g transform="translate(8.5,4.83334)"><g stroke="none" stroke-miterlimit="10"><path d="M-8.5,364.83334v-369.66667h497v369.66667z" fill="#000000" stroke-width="0"/><image x="302" y="71" transform="scale(0.5,0.5)" width="379" height="588" xlink:href="data:image/png;base64," fill="none" stroke-width="0.5"/><text transform="translate(175.7,84.52281) scale(0.3225,0.3225)" font-size="40" xml:space="preserve" fill="#000000" stroke-width="1" font-family="&quot;handwriting 20&quot;, Sans Serif" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">My Sweet Regina,</tspan><tspan x="0" dy="46.150000000000006px"> </tspan><tspan x="0" dy="46.150000000000006px">Today was long, and every tick of the </tspan><tspan x="0" dy="46.150000000000006px">clock seemed to stretch endlessly without </tspan><tspan x="0" dy="46.150000000000006px">you near. I found your scarf in the </tspan><tspan x="0" dy="46.150000000000006px">hallway this morning and it still smelled </tspan><tspan x="0" dy="46.150000000000006px">of you—a comfort in your absence. </tspan><tspan x="0" dy="46.150000000000006px">The factory floor is as loud as ever, </tspan><tspan x="0" dy="46.150000000000006px">but it cannot drown out thoughts of you. </tspan><tspan x="0" dy="46.150000000000006px">I hope you are well, my darling.</tspan><tspan x="0" dy="46.150000000000006px"> </tspan><tspan x="0" dy="46.150000000000006px">Always,</tspan><tspan x="0" dy="46.150000000000006px">Joseph</tspan></text></g></g></svg>