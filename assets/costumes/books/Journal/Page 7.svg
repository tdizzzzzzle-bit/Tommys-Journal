<svg version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="411" height="260" viewBox="0,0,411,260"><g transform="translate(-34.50002,-50)"><g stroke="none" stroke-miterlimit="10"><image x="69.00004" y="100" transform="scale(0.5,0.5)" width="822" height="520" xlink:href="data:image/png;base64," fill="none" stroke-width="0.5"/><text transform="translate(243.83333,78.13402) scale(0.26583,0.26583)" font-size="40" xml:space="preserve" fill="#000000" stroke-width="1" font-family="Handwriting" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">October 23 1946</tspan><tspan x="0" dy="46.150000000000006px">     After having explored the house, I am</tspan><tspan x="0" dy="46.150000000000006px">disappointed that there is not a third story.</tspan><tspan x="0" dy="46.150000000000006px">There is a staircase on the second story,</tspan><tspan x="0" dy="46.150000000000006px">but at the top of the stairs there is just</tspan><tspan x="0" dy="46.150000000000006px">a blank solid wall right where a door should</tspan><tspan x="0" dy="46.150000000000006px">be. I also cannot find the basement or the </tspan><tspan x="0" dy="46.150000000000006px">attic. Strange that Papa insists that there</tspan><tspan x="0" dy="46.150000000000006px">is a third stroy, and attic, and a basement.</tspan><tspan x="0" dy="46.150000000000006px">    There is a cool long hallway to a castle </tspan><tspan x="0" dy="46.150000000000006px">room, where me and Rosie have had many</tspan><tspan x="0" dy="46.150000000000006px">races. She is always faster than me though. </tspan></text><text transform="translate(62.125,137.40357) scale(0.26969,0.26969)" font-size="40" xml:space="preserve" fill="#ff0000" stroke-width="1" font-family="Handwriting" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">The third story exists and it is VERY</tspan><tspan x="0" dy="48px">dangerous.</tspan></text><path d="M225.31115,109.48961c-0.23961,-0.43885 0.19923,-0.67846 0.