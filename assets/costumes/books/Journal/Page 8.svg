<svg version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="411" height="260" viewBox="0,0,411,260"><g transform="translate(-34.5,-50)"><g stroke="none" stroke-miterlimit="10"><image x="69" y="100" transform="scale(0.5,0.5)" width="822" height="520" xlink:href="data:image/png;base64," fill="none" stroke-width="0.5"/><text transform="translate(245.01802,80.51227) scale(0.30775,0.30775)" font-size="40" xml:space="preserve" fill="#000000" stroke-width="1" font-family="Handwriting" font-weight="normal" text-anchor="start"><tspan x="0" dy="0"> </tspan></text><text transform="translate(53.1393,77.26356) scale(0.27517,0.27517)" font-size="40" xml:space="preserve" fill="#000000" stroke-width="1" font-family="Handwriting" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">October 29th 1946</tspan><tspan x="0" dy="48px">I have been thinking a lot about the spooky</tspan><tspan x="0" dy="48px">feeling/presence the house has. It feels</tspan><tspan x="0" dy="48px">almost tangible. In the following rooms</tspan><tspan x="0" dy="48px">I have ranked the feeling on a scale of</tspan><tspan x="0" dy="48px">1 to 10:</tspan><tspan x="0" dy="48px"> </tspan><tspan x="0" dy="48px">west parlour-4/10</tspan><tspan x="0" dy="48px">office-2/10</tspan><tspan x="0" dy="48px">library-6/10</tspan><tspan x="0" dy="48px">piano room-7/10</tspan><tspan x="0" dy="48px">closet-1/10</tspan><tspan x="0" dy="48px">laundry room-1/10</tspan><tspan x="0" dy="48px">dining room-8/10</tspan><tspan x="0" dy="48px">east parlour- 2/10</tspan><tspan x="0" dy="48px">garden- 5/10</tspan><tspan x="0" dy="48px">bathroom- 7/10</tspan></text><text transform="translate(246.51981,79.2265) scale(0.27517,0.27517)" font-size="40" xml:space="preserve" fill="#000000" stroke-width="1" font-family="Handwriting" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">ballroom-9/10</tspan><tspan x="0" dy="48px">entry way-0/10</tspan><tspan x="0" dy="48px">library-6/10</tspan><tspan x="0" dy="48px">my bedroom-1/10</tspan><tspan x="0" dy="48px">grand hall-3/10</tspan><tspan x="0" dy="48px"> </tspan><tspan x="0" dy="48px">     This feeling is way more strong on</tspan><tspan x="0" dy="48px">the upper stories of the house, usually </tspan><tspan x="0" dy="48px">being around an 8-10 range, so I don't</tspan><tspan x="0" dy="48px">have it notated here.</tspan><tspan x="0" dy="48px">     I have been reading the books in both</tspan><tspan x="0" dy="48px">librarys and there seems to be little to </tspan><tspan x="0" dy="48px">nothing regarding the source or what the</tspan><tspan x="0" dy="48px">strange force this house has contains, </tspan><tspan x="0" dy="48px">although there was some intresting </tspan><tspan x="0" dy="48px">information regarding this house's history</tspan><tspan x="0" dy="48px">as well as Sir Vladislav.</tspan></text></g></g></svg>