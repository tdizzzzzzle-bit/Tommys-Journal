<svg version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="411" height="260" viewBox="0,0,411,260"><g transform="translate(-34.5,-49.99999)"><g stroke="none" stroke-miterlimit="10"><image x="69" y="99.99998" transform="scale(0.5,0.5)" width="822" height="520" xlink:href="data:image/png;base64," fill="none" stroke-width="0.5"/><text transform="translate(244.375,77.09786) scale(0.27318,0.27318)" font-size="40" xml:space="preserve" fill="#000000" stroke-width="1" font-family="Handwriting" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">October 12, 1946</tspan><tspan x="0" dy="46.150000000000006px">     Me and my family moved to this </tspan><tspan x="0" dy="46.150000000000006px">mansion today, and they gifted me this </tspan><tspan x="0" dy="46.150000000000006px">journal. We inherited the mansion from</tspan><tspan x="0" dy="46.150000000000006px">our ancestor Sir Vladislav Riker, and it </tspan><tspan x="0" dy="46.150000000000006px">is in the heart of Pennsylvania, in the </tspan><tspan x="0" dy="46.150000000000006px">middle of the woods. At first I was upset </tspan><tspan x="0" dy="46.150000000000006px">about the move, but I understand that my </tspan><tspan x="0" dy="46.150000000000006px">father wants to get a fresh start after</tspan><tspan x="0" dy="46.150000000000006px">his service in the war. He's never been</tspan><tspan x="0" dy="46.150000000000006px">quite the same after he served, and he</tspan><tspan x="0" dy="46.150000000000006px">has been traumatized after the things he</tspan><tspan x="0" dy="46.150000000000006px">saw. We're all just glad that the war is </tspan><tspan x="0" dy="46.150000000000006px">over and that my father made it back</tspan><tspan x="0" dy="46.150000000000006px">safley. </tspan><tspan x="0" dy="46.150000000000006px">     This mansion is huge! It has 3 stories,</tspan><tspan x="0" dy="46.150000000000006px">an attic, and a basement. This will be </tspan></text><text transform="translate(55.39739,79.0594) scale(0.28245,0.28245)" font-size="40" xml:space="preserve" fill="#ff0000" stroke-width="1" font-family="Handwriting" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">music repels him. play anything on the</tspan><tspan x="0" dy="46.150000000000006px">piano to make him leave you alone.</tspan><tspan x="0" dy="46.150000000000006px"> </tspan></text></g></g></svg>