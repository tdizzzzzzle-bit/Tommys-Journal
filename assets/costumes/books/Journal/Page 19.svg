<svg version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="411" height="260" viewBox="0,0,411,260"><g transform="translate(-34.5,-50)"><g stroke="none" stroke-miterlimit="10"><image x="69" y="100" transform="scale(0.5,0.5)" width="822" height="520" xlink:href="data:image/png;base64," fill="none" stroke-width="0.5"/><text transform="translate(56.33333,80.60124) scale(0.27902,0.27902)" font-size="40" xml:space="preserve" fill="#000000" stroke-width="1" font-family="Handwriting" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">November 29th 1946</tspan><tspan x="0" dy="48px"> </tspan><tspan x="0" dy="48px">I never realized the ability of a clock's</tspan><tspan x="0" dy="48px">pendulum to mesmerize those who look</tspan><tspan x="0" dy="48px">upon it. I became rather intruigued by </tspan><tspan x="0" dy="48px">the clock in the dining room. For some </tspan><tspan x="0" dy="48px">reason when Rosie touches it, it </tspan><tspan x="0" dy="48px">infuriates me. The thought of her ruining</tspan><tspan x="0" dy="48px">something so great and beautiful, made</tspan><tspan x="0" dy="48px">me so mad I may have actually hurt her.</tspan><tspan x="0" dy="48px">I don't know why I love the clock so </tspan><tspan x="0" dy="48px">much, but it brings me peace to see the</tspan><tspan x="0" dy="48px">hands so definatly turning, so consistant,</tspan><tspan x="0" dy="48px">it almost feels like it is the only</tspan><tspan x="0" dy="48px">consistent thing in this house. I don't </tspan><tspan x="0" dy="48px">know what is happening to me.</tspan></text><text transform="translate(244.33333,76.93457) scale(0.27902,0.27902)" font-size="40" xml:space="preserve" fill="#000000" stroke-width="1" font-family="Handwriting" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">Whenever someone messes with the </tspan><tspan x="0" dy="48px">clock I lose controll of myself. I can see</tspan><tspan x="0" dy="48px">my own body attacking and trying to hurt</tspan><tspan x="0" dy="48px">those who touch it, but the actions are </tspan><tspan x="0" dy="48px">not my own.</tspan><tspan x="0" dy="48px">    I hate seeing my face now. Every time</tspan><tspan x="0" dy="48px">I see the fmily painting my heart fills with</tspan><tspan x="0" dy="48px">despise for my ugly face. I feel so much </tspan><tspan x="0" dy="48px">hate these days.</tspan><tspan x="0" dy="48px">     Mom wont talk anymore, and she has</tspan><tspan x="0" dy="48px">sit in a bathrobe in her room for the past</tspan><tspan x="0" dy="48px">few days. The only time she comes out</tspan><tspan x="0" dy="48px">of there is to yell at me when I am </tspan><tspan x="0" dy="48px">practicing piano. The voice isn't hers. On</tspan><tspan x="0" dy="48px">the bright side, her hair is longer. Maybe</tspan><tspan x="0" dy="48px">a bit too long though. She keeps getting</tspan><tspan x="0" dy="48px">tangled in it.</tspan></text></g></g></svg>