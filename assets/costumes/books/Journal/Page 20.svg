<svg version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="411" height="260" viewBox="0,0,411,260"><g transform="translate(-34.5,-50)"><g stroke="none" stroke-miterlimit="10"><image x="69" y="100" transform="scale(0.5,0.5)" width="822" height="520" xlink:href="data:image/png;base64," fill="none" stroke-width="0.5"/><text transform="translate(56.33333,80.60124) scale(0.27902,0.27902)" font-size="40" xml:space="preserve" fill="#000000" stroke-width="1" font-family="Handwriting" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">December 5th 1946</tspan><tspan x="0" dy="48px">     Today was my birthday. Nothing felt</tspan><tspan x="0" dy="48px">special though. No one in my family talks</tspan><tspan x="0" dy="48px">or goes out of the house. No one </tspan><tspan x="0" dy="48px">answers the door. My mom has become</tspan><tspan x="0" dy="48px">so tangled with her hair that she cant</tspan><tspan x="0" dy="48px">walk. Instead she drags herself on her </tspan><tspan x="0" dy="48px">belly and mutters. Its extremly creepy. </tspan><tspan x="0" dy="48px">    I discovered that the wall rotted away</tspan><tspan x="0" dy="48px">at the top of the second story stairs.</tspan><tspan x="0" dy="48px">There is a third story after all. Not only</tspan><tspan x="0" dy="48px">this, but there is an attic door too. I got</tspan><tspan x="0" dy="48px">lost in the attic- it doesn't behave like</tspan><tspan x="0" dy="48px">normal hallways. Most attics dont have </tspan><tspan x="0" dy="48px">hallways either. Anyways, I found a </tspan><tspan x="0" dy="48px">glowing red key, that locks the attic.</tspan></text><text transform="translate(244.33333,80.26791) scale(0.27902,0.27902)" font-size="40" xml:space="preserve" fill="#000000" stroke-width="1" font-family="Handwriting" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">It is the perfect place to lock up Rosie.</tspan><tspan x="0" dy="48px">I will lead her in there to show her that</tspan><tspan x="0" dy="48px">I found it, but I will run out and escape</tspan><tspan x="0" dy="48px">because I know the way and she doesn't.</tspan><tspan x="0" dy="48px">Then I will lock her in there just in case.</tspan><tspan x="0" dy="48px">However, because I need to be faster,</tspan><tspan x="0" dy="48px">I will have to use one of my cursed sketch</tspan><tspan x="0" dy="48px">books, to make a Dash spell.</tspan><tspan x="0" dy="48px"> </tspan><tspan x="0" dy="48px">     The Dash spell hurts way worse to </tspan><tspan x="0" dy="48px">use. But I still managed to run enough</tspan><tspan x="0" dy="48px">distance fast enough to complete my </tspan><tspan x="0" dy="48px">plan. Rosie is now locked in an attic maze</tspan><tspan x="0" dy="48px">and I have the key. I will have to find a </tspan><tspan x="0" dy="48px">very good hiding spot for both the key</tspan><tspan x="0" dy="48px">and the spell book.</tspan></text></g></g></svg>