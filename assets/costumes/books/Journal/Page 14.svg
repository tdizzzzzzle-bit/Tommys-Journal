<svg version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="411" height="260" viewBox="0,0,411,260"><g transform="translate(-34.5,-50)"><g stroke="none" stroke-miterlimit="10"><image x="69" y="100" transform="scale(0.5,0.5)" width="822" height="520" xlink:href="data:image/png;base64," fill="none" stroke-width="0.5"/><text transform="translate(53.61629,77.63882) scale(0.27517,0.27517)" font-size="40" xml:space="preserve" fill="#000000" stroke-width="1" font-family="Handwriting" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">November 17th 1946</tspan><tspan x="0" dy="48px">     When I grabbed my old sketch book</tspan><tspan x="0" dy="48px">today, I suddenly started seeing things,</tspan><tspan x="0" dy="48px">feeling almost unbearable, growing, pain.</tspan><tspan x="0" dy="48px">I dropped it before it became painful, and it</tspan><tspan x="0" dy="48px">opened to the page where I wrote the </tspan><tspan x="0" dy="48px">hebrew and latin. I had an overwhelming</tspan><tspan x="0" dy="48px">urge to say "palmatyr". The word kept</tspan><tspan x="0" dy="48px">repeating in my head. I got this weird </tspan><tspan x="0" dy="48px">feeling, and I could feel my eyes roll back.</tspan><tspan x="0" dy="48px">I whispered the word and the room </tspan><tspan x="0" dy="48px">instantly went cold. It felt like I couldn't</tspan><tspan x="0" dy="48px">breathe but I was still breathing. I heard a </tspan><tspan x="0" dy="48px">loud and creepy voice in my head say, "You</tspan><tspan x="0" dy="48px">get your wish. You can be invisible now.</tspan><tspan x="0" dy="48px">When you hold this book, and stand still</tspan><tspan x="0" dy="48px">no one will see you"</tspan></text><text transform="translate(243.61629,76.97215) scale(0.27517,0.27517)" font-size="40" xml:space="preserve" fill="#000000" stroke-width="1" font-family="Handwriting" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">As I walk around, I feel an evil presence </tspan><tspan x="0" dy="48px">watching me. A breath on my neck, and a</tspan><tspan x="0" dy="48px">chill down my spine. The words I say are </tspan><tspan x="0" dy="48px">not my own. I keep doing things I don't </tspan><tspan x="0" dy="48px">want to do. I did wish I could be invisible </tspan><tspan x="0" dy="48px">before, because of everyone constantly</tspan><tspan x="0" dy="48px">bothering me, but I never told anyone</tspan><tspan x="0" dy="48px">about it.</tspan><tspan x="0" dy="48px">      Checking through my other sketch</tspan><tspan x="0" dy="48px">books, I noticed they all have a page with</tspan><tspan x="0" dy="48px">the hebrew and latin written. Every day</tspan><tspan x="0" dy="48px">they becken me to take them and activate</tspan><tspan x="0" dy="48px">them. Something inside me says its a</tspan><tspan x="0" dy="48px">bad Idea though. For now, I'll leave my </tspan><tspan x="0" dy="48px">demon book in the secret room.</tspan></text></g></g></svg>