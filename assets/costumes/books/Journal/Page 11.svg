<svg version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="411" height="260" viewBox="0,0,411,260"><g transform="translate(-34.5,-50)"><g stroke="none" stroke-miterlimit="10"><image x="69" y="100" transform="scale(0.5,0.5)" width="822" height="520" xlink:href="data:image/png;base64," fill="none" stroke-width="0.5"/><text transform="translate(54.11629,77.63882) scale(0.27517,0.27517)" font-size="40" xml:space="preserve" fill="#000000" stroke-width="1" font-family="Handwriting" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">October 30th 1946</tspan><tspan x="0" dy="48px">     Mom has been sleep walking... a lot.</tspan><tspan x="0" dy="48px">so has Rosie. It didn't seem like much</tspan><tspan x="0" dy="48px">before, but last night, I woke up to find</tspan><tspan x="0" dy="48px">I had slept walked. Not only this, but Mom</tspan><tspan x="0" dy="48px">was there too, but she hadn't waken up </tspan><tspan x="0" dy="48px">yet. </tspan><tspan x="0" dy="48px">     Her eyes were open. She was staring</tspan><tspan x="0" dy="48px">at the wall with a dead look in her</tspan><tspan x="0" dy="48px">eyes. The scariest part wasn't that her </tspan><tspan x="0" dy="48px">eyes were milky white, as if she had been </tspan><tspan x="0" dy="48px">blind for years, but she was in a trance,</tspan><tspan x="0" dy="48px">saying things in languages that sound like</tspan><tspan x="0" dy="48px">latin, hebrew, or greek.</tspan><tspan x="0" dy="48px">     I know I said I didn't believe in magic,</tspan><tspan x="0" dy="48px">but this was too crazy. Whatever magic</tspan><tspan x="0" dy="48px">lies in this house is definately evil.</tspan></text></g></g></svg>