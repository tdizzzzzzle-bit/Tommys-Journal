<svg version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="411" height="260" viewBox="0,0,411,260"><g transform="translate(-34.5,-50)"><g stroke="none" stroke-miterlimit="10"><image x="69" y="100" transform="scale(0.5,0.5)" width="822" height="520" xlink:href="data:image/png;base64," fill="none" stroke-width="0.5"/><text transform="translate(56.94962,77.27401) scale(0.25578,0.25578)" font-size="40" xml:space="preserve" fill="#000000" stroke-width="1" font-family="Handwriting" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">December 12th</tspan><tspan x="0" dy="48px">    Now that I don't have the axe, I am going</tspan><tspan x="0" dy="48px">crazy. All I have been doing for the past day</tspan><tspan x="0" dy="48px">is look at the dining room clock. I can feel </tspan><tspan x="0" dy="48px">the demons entering me, but I have gotten</tspan><tspan x="0" dy="48px">toa point that I do not care what happens </tspan><tspan x="0" dy="48px">when I am possessed. I am losing touch with</tspan><tspan x="0" dy="48px">the world, and I don't feel like there is </tspan><tspan x="0" dy="48px">anything to live for. I havent eaten drank, or</tspan><tspan x="0" dy="48px">felt alive for a week now. I only go to the </tspan><tspan x="0" dy="48px">bathroom.</tspan><tspan x="0" dy="48px">    There are a lot of dead bodies in this </tspan><tspan x="0" dy="48px">house, but they are rotting very slowly. I am</tspan><tspan x="0" dy="48px">scared that someone will come to this house,</tspan><tspan x="0" dy="48px">I might do something terrible, and they might</tspan><tspan x="0" dy="48px">release mother. I can't do this anymore. I</tspan><tspan x="0" dy="48px">am going to sleep. </tspan><tspan x="0" dy="48px">     The light spell is in mom's dresser.</tspan></text><text transform="translate(247.44962,77.77401) scale(0.25578,0.25578)" font-size="40" xml:space="preserve" fill="#000000" stroke-width="1" font-family="Handwriting" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">I know you are reading this. The shadows</tspan><tspan x="0" dy="48px">whisper your name. They want to hear you</tspan><tspan x="0" dy="48px">BLEED.</tspan><tspan x="0" dy="48px"> </tspan><tspan x="0" dy="48px">You will fail Detective James Harker</tspan><tspan x="0" dy="48px"> </tspan></text><text transform="translate(252.62477,172.65584) scale(0.39041,0.39041)" font-size="40" xml:space="preserve" fill="#000000" stroke-width="1" font-family="&quot;ChopinScript&quot;, Serif" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">My hand must be fed,</tspan><tspan x="0" dy="46.15px">my power must grow</tspan><tspan x="0" dy="46.15px">His family dead</tspan><tspan x="0" dy="46.15px">The killing be slow</tspan><tspan x="0" dy="46.15px"> </tspan><tspan x="0" dy="46.15px">-The lord of hands Palmatyr</tspan></text><text transform="translate(321.47233,138.42717) rotate(8.84292) scale(0.26474,0.26474)" font-size="40" xml:space="preserve" fill="#ff0000" stroke-width="1" font-family="Handwriting" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">Avenge me, take the</tspan><tspan x="0" dy="46.15px">axe and save the family.</tspan></text></g></g></svg>