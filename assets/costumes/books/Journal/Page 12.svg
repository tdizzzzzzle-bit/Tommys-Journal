<svg version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="411" height="260" viewBox="0,0,411,260"><g transform="translate(-34.5,-50)"><g stroke="none" stroke-miterlimit="10"><image x="69" y="100" transform="scale(0.5,0.5)" width="822" height="520" xlink:href="data:image/png;base64," fill="none" stroke-width="0.5"/><text transform="translate(54.11629,77.63882) scale(0.27517,0.27517)" font-size="40" xml:space="preserve" fill="#000000" stroke-width="1" font-family="Handwriting" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">October 31st 1946</tspan><tspan x="0" dy="48px">     I was drawing pictures today, </tspan><tspan x="0" dy="48px">and then I blacked out. When I woke up,</tspan><tspan x="0" dy="48px">about an hour later, I was in the corner.</tspan><tspan x="0" dy="48px">I found drawings on the previously blank </tspan><tspan x="0" dy="48px">pages. A strikingly good drawing of a man,</tspan><tspan x="0" dy="48px">with a hand in place of his head. The man</tspan><tspan x="0" dy="48px">looked frail and skinny, yet somehow </tspan><tspan x="0" dy="48px">strong. All over the pages were hewbrew</tspan><tspan x="0" dy="48px">letters and some latin. The hebrew said:</tspan><tspan x="0" dy="48px"> </tspan><tspan x="0" dy="48px">The latin said: "Ave dominus daemoniorum </tspan><tspan x="0" dy="48px">manus Palmatyr"</tspan><tspan x="0" dy="48px">     I looked at my hands to find that they</tspan><tspan x="0" dy="48px">were smudged with lead. I drew those</tspan><tspan x="0" dy="48px">pictures. I am horrified and it doesn't help</tspan><tspan x="0" dy="48px">that today happens to be Halloween.</tspan></text><text transform="translate(55.4117,208.46672) scale(0.26426,0.26426)" font-size="40" xml:space="preserve" fill="#000000" stroke-width="1" font-family="Handwriting" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">אמור את השמות שלנו כדי להכניס אותנו</tspan></text><text transform="translate(243.28755,76.81731) scale(0.27517,0.27517)" font-size="40" xml:space="preserve" fill="#000000" stroke-width="1" font-family="Handwriting" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">   Later, I made lunch for me and Rosie.</tspan><tspan x="0" dy="48px">When I came to get her out of her room,</tspan><tspan x="0" dy="48px">I heard her in her massive closet, coughing</tspan><tspan x="0" dy="48px">or choking violently. I heard snarls, and</tspan><tspan x="0" dy="48px">then a voice that was definatly not hers,</tspan><tspan x="0" dy="48px">said, "Soooo, HUNGRY." When I reached</tspan><tspan x="0" dy="48px">for the door, she opened it, slipped out,</tspan><tspan x="0" dy="48px">and locked it in one swift move. It seemed</tspan><tspan x="0" dy="48px">like she didn't want me to see what was in</tspan><tspan x="0" dy="48px">there. </tspan><tspan x="0" dy="48px">     I offered her lunch and we ate in the </tspan><tspan x="0" dy="48px">dinning room. I am starting to get </tspan><tspan x="0" dy="48px">concerned about Rosie. This house is </tspan><tspan x="0" dy="48px">starting to creep me out.</tspan><tspan x="0" dy="48px"> </tspan></text></g></g></svg>