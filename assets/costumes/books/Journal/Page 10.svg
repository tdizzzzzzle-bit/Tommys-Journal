<svg version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="411" height="260" viewBox="0,0,411,260"><g transform="translate(-34.5,-50)"><g stroke="none" stroke-miterlimit="10"><image x="69" y="100" transform="scale(0.5,0.5)" width="822" height="520" xlink:href="data:image/png;base64," fill="none" stroke-width="0.5"/><text transform="translate(53.61629,77.63882) scale(0.27517,0.27517)" font-size="40" xml:space="preserve" fill="#000000" stroke-width="1" font-family="Handwriting" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">    Because of this "Posessed" state </tspan><tspan x="0" dy="48px">Vladislav took on, maybe this feeling of </tspan><tspan x="0" dy="48px">spookiness resinating in the mansion </tspan><tspan x="0" dy="48px">has something to do with it.</tspan><tspan x="0" dy="48px">     I have also read in places that Vladislav</tspan><tspan x="0" dy="48px">was "blessed" by God himself, after</tspan><tspan x="0" dy="48px">devoting his life to him and the immense </tspan><tspan x="0" dy="48px">kindness he showed to the common folk.</tspan><tspan x="0" dy="48px">      This makes me question things,</tspan><tspan x="0" dy="48px">because it doesn't make sense for </tspan><tspan x="0" dy="48px">someone to be blessed and cursed at the</tspan><tspan x="0" dy="48px">same time. I do have a theory though.</tspan></text><text transform="translate(245.94962,76.30549) scale(0.27517,0.27517)" font-size="40" xml:space="preserve" fill="#000000" stroke-width="1" font-family="Handwriting" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">     There have also been recordings of</tspan><tspan x="0" dy="48px">Vladislav performing miracles, and curses,</tspan><tspan x="0" dy="48px">and the towns people once gave him the </tspan><tspan x="0" dy="48px">name "The Copper Magician". He was a </tspan><tspan x="0" dy="48px">bit of a legend.</tspan><tspan x="0" dy="48px">    I don't believe in magic, but if somehow</tspan><tspan x="0" dy="48px">Vladislav was "magic" then perhaps the </tspan><tspan x="0" dy="48px">presence of him in the manor for so many</tspan><tspan x="0" dy="48px">years left behind some spooky magic </tspan><tspan x="0" dy="48px">residue or something. I dont know but I</tspan><tspan x="0" dy="48px">hope to get to the bottom of this </tspan><tspan x="0" dy="48px">eventually.</tspan></text></g></g></svg>