<svg version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="411" height="260" viewBox="0,0,411,260"><g transform="translate(-34.5,-50)"><g stroke="none" stroke-miterlimit="10"><image x="69" y="100" transform="scale(0.5,0.5)" width="822" height="520" xlink:href="data:image/png;base64," fill="none" stroke-width="0.5"/><text transform="translate(54.61629,77.07532) scale(0.25952,0.25952)" font-size="40" xml:space="preserve" fill="#000000" stroke-width="1" font-family="Handwriting" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">December 7th</tspan><tspan x="0" dy="48px">     I have been hiding in the secret rooms</tspan><tspan x="0" dy="48px">or the nursury reading books from the </tspan><tspan x="0" dy="48px">library. One journal account of Vladislav</tspan><tspan x="0" dy="48px">states that he had a blessed axe, that he</tspan><tspan x="0" dy="48px">kept in a room full of statues. He said the</tspan><tspan x="0" dy="48px">axe prevented demons from coming to him</tspan><tspan x="0" dy="48px">and prevented hm from using curses. He</tspan><tspan x="0" dy="48px">had it made to keep him from going into</tspan><tspan x="0" dy="48px">the Jester state, but it didn't work for </tspan><tspan x="0" dy="48px">that, because of his "lineage."</tspan><tspan x="0" dy="48px">     I am planning to use the axe to expell</tspan><tspan x="0" dy="48px">the demons from Mom and Papa, but I </tspan><tspan x="0" dy="48px">can't get close enough to use it on Mom,</tspan><tspan x="0" dy="48px">so For now, I will just use it on Papa. </tspan><tspan x="0" dy="48px">When I hold the axe my cursed books </tspan><tspan x="0" dy="48px">don't work, so I will have to do it without</tspan><tspan x="0" dy="48px">them.</tspan></text><text transform="translate(244.61629,76.83311) scale(0.26205,0.26205)" font-size="40" xml:space="preserve" fill="#000000" stroke-width="1" font-family="Handwriting" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">     When I used the axe, Papa went crazy,</tspan><tspan x="0" dy="48px">and smashed a clock in the storage room.</tspan><tspan x="0" dy="48px">I lost controll of myself, and cut off his</tspan><tspan x="0" dy="48px">right arm. I blacked out, and when I woke </tspan><tspan x="0" dy="48px">up, holding the axe, I somehow had </tspan><tspan x="0" dy="48px">stitched Papa's mouth shut. I felt horrible</tspan><tspan x="0" dy="48px">so I also sewed him a shirt with a button</tspan><tspan x="0" dy="48px">sleeve for his missing arm. I hate this </tspan><tspan x="0" dy="48px">house and all the demons in it.</tspan><tspan x="0" dy="48px"> </tspan><tspan x="0" dy="48px">     I needed to be silent to survive mother,</tspan><tspan x="0" dy="48px">so I cursed another book. While holding</tspan><tspan x="0" dy="48px">it, I make no sound. I bought the axe into</tspan><tspan x="0" dy="48px">the hall, dropped it, and hid by it with my</tspan><tspan x="0" dy="48px">other cursed book, then screamed. Mom</tspan><tspan x="0" dy="48px">came in looking around, and when she </tspan><tspan x="0" dy="48px">looked away I used my silent spell to sneak</tspan><tspan x="0" dy="48px">to the axe and I thrusted it into her back.</tspan></text></g></g></svg>