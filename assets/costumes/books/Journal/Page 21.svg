<svg version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="411" height="260" viewBox="0,0,411,260"><g transform="translate(-34.5,-50)"><g stroke="none" stroke-miterlimit="10"><image x="69" y="100" transform="scale(0.5,0.5)" width="822" height="520" xlink:href="data:image/png;base64," fill="none" stroke-width="0.5"/><text transform="translate(54.66666,76.85124) scale(0.27902,0.27902)" font-size="40" xml:space="preserve" fill="#000000" stroke-width="1" font-family="Handwriting" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">December 6th 1946</tspan><tspan x="0" dy="48px">      I found another secret. I noticed the </tspan><tspan x="0" dy="48px">candle sticks in the west parlour can </tspan><tspan x="0" dy="48px">twist. As I twist them a different Hebrew</tspan><tspan x="0" dy="48px">symbol shows up next to it. When I touch</tspan><tspan x="0" dy="48px">the heart in the middle, it changes to</tspan><tspan x="0" dy="48px">different suits of cards. Somehow the</tspan><tspan x="0" dy="48px">paintings change according to their </tspan><tspan x="0" dy="48px">positions. When I left the orientation as</tspan><tspan x="0" dy="48px">"מֵ♥︎ת" , I got a feeling to put the Dash</tspan><tspan x="0" dy="48px">spell in the oven. I did so, satisfied with</tspan><tspan x="0" dy="48px">this hiding spot.</tspan><tspan x="0" dy="48px">     Now that Rosie is missing, Papa and</tspan><tspan x="0" dy="48px">Mom are getting scarier. Mom gets more</tspan><tspan x="0" dy="48px">aggrivated when I am loud, and she tries</tspan><tspan x="0" dy="48px">to kill me. I saw her tear someone's spine</tspan><tspan x="0" dy="48px">out in my dream, so I don't want to bother</tspan></text><path d="M81.11218,185.58154c-3.42875,-1.63494 -8.99788,-0.12125 -12.28699,-0.11887c-5.63148,0.56677 -11.55487,1.51232 -11.47454,8.6258c0,1.43513 -0.47524,3.71192 0.35986,4.95152c2.18671,3.24591 8.00079,2.46825 11.29737,2.95202c4.51953,0.1083 14.50099,0.9819 16.29001,-4.64696c2.22543,-3.33814 1.97245,-9.30843 -2.01277,-10.73374c-0.00294,0.00304 -0.00593,0.00609 -0.00898,0.00913c-0.35355,0.35355 -0.70711,0 -0.70711,0c-0.08435,-0.0882 -0.17162,-0.17241 -0.26166,-0.25279c-0.09921,-0.01501 -0.20023,-0.02761 -0.30307,-0.03773l-0.60892,-0.26762c0,0 -0.32051,-0.16025 -0.28319,-0.48076zM82.69998,185.42109c5.34107,1.02308 6.24804,8.23557 3.49622,12.36331c-2.11903,6.1083 -12.19456,5.33501 -17.27373,5.20396c-3.68968,-0.5446 -9.6457,0.23138 -12.06261,-3.42264c-0.96587,-1.46025 -0.50921,-3.80715 -0.50921,-5.47725c0.06786,-7.69268 6.1486,-9.00078 12.42473,-9.62455c4.09758,0.00304 10.26883,-1.79028 13.9246,0.95718z" fill="#ff0000" stroke-width="0.5"/><text transform="translate(244,76.85124) scale(0.27902,0.27902)" font-size="40" xml:space="preserve" fill="#000000" stroke-width="1" font-family="Handwriting" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">her. She mutters that she hates me, and</tspan><tspan x="0" dy="48px">searches the house looking for me. I keep</tspan><tspan x="0" dy="48px">using my hide spell to stay safe. Also for </tspan><tspan x="0" dy="48px">some reason, she won't go into the </tspan><tspan x="0" dy="48px">nursury. </tspan><tspan x="0" dy="48px">     Papa, wont move while I look at him, </tspan><tspan x="0" dy="48px">but when I look away, I hear him scream </tspan><tspan x="0" dy="48px">and chase me. His body is stretched </tspan><tspan x="0" dy="48px">unusually large, obviously due to demonic</tspan><tspan x="0" dy="48px">possession, and when he holds up his</tspan><tspan x="0" dy="48px">right arm, the room goes dark.</tspan><tspan x="0" dy="48px">     I am going insane trying to stay alive</tspan><tspan x="0" dy="48px">and I can feel demons coming closer. I </tspan><tspan x="0" dy="48px">need some way to fix this.</tspan></text><path d="M419.16667,106.16667c0,1 -1,1 -1,1h-0.66667c-2.22358,-0.00985 -4.40961,-0.33333 -6.66667,-0.33333c-5.99062,-0.09211 -12.25326,0.33333 -18.33333,0.33333c-2.81668,0 -5.63735,0.14344 -8.31623,-0.71798c0,0 -0.94868,-0.31623 -0.63246,-1.26491c0.31623,-0.94868 1.26491,-0.63246 1.26491,-0.63246c2.99351,1.04611 6.51988,0.61535 9.68377,0.61535c5.45091,0 10.96364,-0.27357 16.33333,-0.33333c2.24599,0 4.45933,0.34525 6.66667,0.33333h0.66667c0,0 1,0 1,1z" fill="#ff0000" stroke-width="0.5"/><path d="M393.5,118.83333c0,1 -1,1 -1,1l-0.01711,-0.05132c-4.66469,1.49997 -10.10632,0.94427 -14.93785,1.38757c-7.01857,0.64396 -13.984,0.66375 -21.04504,0.66375c-12.90669,0 -25.50387,-0.80607 -38.36661,-1.66722c-13.10001,0.00751 -26.20004,0.00055 -39.30006,0.00055c-10.98566,-0.00272 -21.99903,0.33333 -33,0.33333c0,0 -1,0 -1,-1c0,-1 1,-1 1,-1c11.00147,0 22.01365,-0.3307 33,-0.33333c13.1222,0 26.24442,-0.00648 39.36661,0.00055c12.84173,0.8526 25.41471,1.66611 38.30006,1.66611c7.0069,0 13.91254,-0.03257 20.8772,-0.65669c4.60016,-0.41223 10.07215,0.24602 14.47324,-1.29199l0.64956,-0.05132c0,0 1,0 1,1z" fill="#ff0000" stroke-width="0.5"/><path d="M284.16667,133.5c0,1 -1,1 -1,1h-0.33333c-1.76742,0 -3.34542,-0.04689 -5.10407,-0.33876c-3.21509,-0.13593 -6.50367,-0.08646 -9.70458,-0.3944c-2.71921,-0.26159 -5.33818,-1.21807 -8.09281,-0.93837c-5.11691,0.51956 -10.26779,1.3382 -15.43187,1.3382c0,0 -1,0 -1,-1c0,-1 1,-1 1,-1c5.10036,0 10.1795,-0.83022 15.2348,-1.32847c2.91367,-0.28717 5.61206,0.66151 8.4815,0.93784c3.20638,0.30877 6.50051,0.25294 9.72111,0.39606c1.69803,0.28422 3.19061,0.3279 4.89593,0.3279h0.33333c0,0 1,0 1,1z" fill="#ff0000" stroke-width="0.5"/></g></g></svg>