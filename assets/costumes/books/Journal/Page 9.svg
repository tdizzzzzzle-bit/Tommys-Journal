<svg version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="411" height="260" viewBox="0,0,411,260"><g transform="translate(-34.5,-50)"><g stroke="none" stroke-miterlimit="10"><image x="69" y="100" transform="scale(0.5,0.5)" width="822" height="520" xlink:href="data:image/png;base64," fill="none" stroke-width="0.5"/><text transform="translate(53.61629,77.63882) scale(0.27517,0.27517)" font-size="40" xml:space="preserve" fill="#000000" stroke-width="1" font-family="Handwriting" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">    So the founder of the house's full name</tspan><tspan x="0" dy="48px">was "Sir Vladislav 'copper' Riker".</tspan><tspan x="0" dy="48px">There are no records of when he was</tspan><tspan x="0" dy="48px">born or when he died, however, there are</tspan><tspan x="0" dy="48px">some legends that he never died, and he</tspan><tspan x="0" dy="48px">wants to take back the house. </tspan><tspan x="0" dy="48px">    There are records of him being absurdly</tspan><tspan x="0" dy="48px">tall: 10'3". That is crazy, but it explains </tspan><tspan x="0" dy="48px">why the house's ceilings are so tall. </tspan><tspan x="0" dy="48px">however there is also documents stating</tspan><tspan x="0" dy="48px">that he was infact 6'11" which is still tall</tspan><tspan x="0" dy="48px">but not as tall. I think, the 10'3" is an </tspan><tspan x="0" dy="48px">exaggeration.</tspan><tspan x="0" dy="48px">     I assume Vladislav was born in Russia, </tspan><tspan x="0" dy="48px">due to the obviously russian name. I also </tspan><tspan x="0" dy="48px">read somewhere that his wife was named</tspan><tspan x="0" dy="48px">Ava Rose. But apparently, he wished to</tspan></text><text transform="translate(244.02145,77.30549) scale(0.27517,0.27517)" font-size="40" xml:space="preserve" fill="#000000" stroke-width="1" font-family="Handwriting" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">never have the name spoken, after her </tspan><tspan x="0" dy="48px">death. Because it "brought too much pain</tspan><tspan x="0" dy="48px">to be reminded of the eternal separation</tspan><tspan x="0" dy="48px">between them" </tspan><tspan x="0" dy="48px">     Back to the topic of the weirdness of</tspan><tspan x="0" dy="48px">the house, Sir Vladislav, had been said to</tspan><tspan x="0" dy="48px">have some sort of split personality</tspan><tspan x="0" dy="48px">disorder, and back in his time (somewhere</tspan><tspan x="0" dy="48px">in the 1860's) he was said to be possesed.</tspan><tspan x="0" dy="48px">    By account of his wife: "It all happened</tspan><tspan x="0" dy="48px">after he saved me. He was never quite the</tspan><tspan x="0" dy="48px">same, calling himself some strange names</tspan><tspan x="0" dy="48px">and doing more humanly impossible things.</tspan><tspan x="0" dy="48px">However If I showed love for him he</tspan><tspan x="0" dy="48px">would snap out of it."</tspan></text></g></g></svg>