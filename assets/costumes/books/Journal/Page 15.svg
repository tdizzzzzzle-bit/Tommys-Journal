<svg version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="411" height="260" viewBox="0,0,411,260"><g transform="translate(-34.5,-50)"><g stroke="none" stroke-miterlimit="10"><image x="69" y="100" transform="scale(0.5,0.5)" width="822" height="520" xlink:href="data:image/png;base64," fill="none" stroke-width="0.5"/><text transform="translate(53.61629,77.63882) scale(0.27517,0.27517)" font-size="40" xml:space="preserve" fill="#000000" stroke-width="1" font-family="Handwriting" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">November 18th 1946</tspan><tspan x="0" dy="48px">     Nothing much happened today, other</tspan><tspan x="0" dy="48px">than my father enjoying my piano practice.</tspan><tspan x="0" dy="48px">It put him particularly at ease, when I </tspan><tspan x="0" dy="48px">played the 5th symphony on the piano.</tspan><tspan x="0" dy="48px">It reminds me of one of Sir Copper's</tspan><tspan x="0" dy="48px">poems:</tspan><tspan x="0" dy="48px"> </tspan><tspan x="0" dy="48px">Songs can push away dark</tspan><tspan x="0" dy="48px">Evil flees from delacate melodies </tspan><tspan x="0" dy="48px">Villains will lose thier mark</tspan><tspan x="0" dy="48px">Ever guilty of thier past tragedies</tspan><tspan x="0" dy="48px">Repeling darkness with a spark</tspan><tspan x="0" dy="48px">Even he who hates the majesties</tspan><tspan x="0" dy="48px">Dances to a melodic remark</tspan></text><text transform="translate(243.11629,76.38882) scale(0.27517,0.27517)" font-size="40" xml:space="preserve" fill="#000000" stroke-width="1" font-family="Handwriting" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">There is maybe some sort of magic </tspan><tspan x="0" dy="48px">attached to music in this manor. This</tspan><tspan x="0" dy="48px">means that there is probably good magic</tspan><tspan x="0" dy="48px">too. Not just the demonic magic </tspan><tspan x="0" dy="48px">harnessed in my sketch book. That</tspan><tspan x="0" dy="48px">thing still gives me a bad feeling, so I think</tspan><tspan x="0" dy="48px">I will burn that book, along with my other</tspan><tspan x="0" dy="48px">sketch books.</tspan></text><text transform="translate(254.19085,209.70981) rotate(-7.28554) scale(0.30495,0.30495)" font-size="40" xml:space="preserve" fill="#ff0000" stroke-width="1" font-family="Handwriting" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">evidently, that didn't go so well</tspan></text><path d="M98.66667,133.16667c0,-0.5 0.5,-0.5 0.5,-0.5h0.33333c5.68658,0 11.31194,-0.33333 17,-0.33333c4.95483,0 9.88059,0.34348 14.82432,0.53735c3.83154,-0.0937 7.66366,-0.20401 11.50902,-0.20401c4.48324,0 8.8625,-0.66677 13.33333,-0.66667c1.61816,0.00004 3.09288,-0.09744 4.53041,0.33603c0.02165,-0.00022 0.04333,-0.0004 0.06502,-0.00053l0.0137,0.02481c0.40889,0.12899 0.81492,0.30195 1.22055,0.53338l-1.23008,0.4418c-0.9946,0.00468 -1.94775,0.11177 -2.93588,0.21981c-6.80531,0.73958 -13.77572,0.44469 -20.66372,0.44469c-1.95208,0 -3.89859,-0.0531 -5.84234,-0.12932c-2.82893,0.06919 -5.65755,0.12932 -8.49099,0.12932c-6.8773,0 -13.76534,-0.33333 -20.66667,-0.33333c-0.66667,0 -1.33333,0 -2,0h-0.66667c0,0 -0.5,0 -0.5,-0.5c0,-0.5 0.5,-0.5 0.5,-0.5c0.66667,0 2,0 2.66667,0c6.90128,0 13.7895,0.33333 20.66667,0.33333c2.8334,0 5.66203,-0.06013 8.49098,-0.12932c1.94372,0.07622 3.89022,0.12932 5.84235,0.12932c6.84968,0 13.78868,0.30572 20.55504,-0.43877c1.00124,-0.10947 1.96911,-0.21496 2.97538,-0.22519c0.02625,0.00792 0.05249,0.01601 0.07872,0.02428l0.22786,0.41266c-1.42505,0.82527 -4.15738,0.22768 -5.83699,0.22703c-4.12567,-0.0016 -8.18462,0.66667 -12.33333,0.66667c-3.8454,0 -7.67749,0.11031 -11.50901,0.20401c-4.94381,-0.19387 -9.86978,-0.53735 -14.82433,-0.53735c-5.68801,0 -11.31329,0.33333 -17,0.33333h-0.33333c0,0 -0.5,0 -0.5,-0.5z" fill="#ff0000" stroke-width="0.5"/></g></g></svg>