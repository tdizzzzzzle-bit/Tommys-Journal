<svg version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="411" height="260" viewBox="0,0,411,260"><g transform="translate(-34.5,-50)"><g stroke="none" stroke-miterlimit="10"><image x="69" y="100" transform="scale(0.5,0.5)" width="822" height="520" xlink:href="data:image/png;base64," fill="none" stroke-width="0.5"/><text transform="translate(54.61629,76.94068) scale(0.25578,0.25578)" font-size="40" xml:space="preserve" fill="#000000" stroke-width="1" font-family="Handwriting" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">Instantly her hair shrunk back to normal size</tspan><tspan x="0" dy="48px">and she stood up. The axe was stuck in her</tspan><tspan x="0" dy="48px">back and she was bleeding but not moving.</tspan><tspan x="0" dy="48px">For the rest of the day, as long as I was </tspan><tspan x="0" dy="48px">quiet, she just stood there. The demons</tspan><tspan x="0" dy="48px">were only weakened by the axe, but not </tspan><tspan x="0" dy="48px">expelled. They still grow her hair though, </tspan><tspan x="0" dy="48px">and it tries to strangle me when I make noise.</tspan><tspan x="0" dy="48px">I tripped and made a lound noise downstairs</tspan><tspan x="0" dy="48px">once, when the lights went out. When they</tspan><tspan x="0" dy="48px">came on a second later, she was in the middle</tspan><tspan x="0" dy="48px">of the room. She seems to move around </tspan><tspan x="0" dy="48px">when I cant see her, and she teleports from</tspan><tspan x="0" dy="48px">places I cant see, to places I cant see. It is </tspan><tspan x="0" dy="48px">very creepy.</tspan></text><text transform="translate(244.94962,76.27401) scale(0.25578,0.25578)" font-size="40" xml:space="preserve" fill="#000000" stroke-width="1" font-family="Handwriting" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">December 8th</tspan><tspan x="0" dy="48px">     I need to Hide my Red key now. I was </tspan><tspan x="0" dy="48px">going to check the rooms on the third floor,</tspan><tspan x="0" dy="48px">But everytime I went in there I would get</tspan><tspan x="0" dy="48px">possessed and leave. It is also very dark. </tspan><tspan x="0" dy="48px">This forsaken house has so few windows.</tspan><tspan x="0" dy="48px">     I needed to get light, and repel demons,</tspan><tspan x="0" dy="48px">so I cursed another book. When I hold it</tspan><tspan x="0" dy="48px">I glow and make enough light to see. When</tspan><tspan x="0" dy="48px">I use it in the third floor, I can see the </tspan><tspan x="0" dy="48px">demons. They are all frozen by the light, but</tspan><tspan x="0" dy="48px">my light flickers. When it does, they move.</tspan><tspan x="0" dy="48px">I will list the different demons, and which to </tspan><tspan x="0" dy="48px">avoid eventually. First I explored the rooms.</tspan><tspan x="0" dy="48px">The map is on the next page.</tspan></text></g></g></svg>